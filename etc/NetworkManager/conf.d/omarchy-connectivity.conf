# Check connectivity against Omarchy's own endpoint instead of Arch's. It must
# stay plain HTTP so a captive portal can intercept it. The endpoint answers
# 204 with "X-NetworkManager-Status: online", so no body is expected. The
# network panel opens the same URL to reach the portal's sign-in page.
[connectivity]
uri=http://ping.omarchy.org/nm-check.txt
response=
